<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: Syne;
      src: url("fonts/Syne.ttf") format("truetype");
      font-weight: 100 800;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "IBM Plex Sans";
      src: url("fonts/IBMPlexSans-Regular.ttf") format("truetype");
      font-weight: 100 700;
      font-style: normal;
      font-display: block;
    }
    @font-face {
      font-family: "IBM Plex Mono";
      src: url("fonts/IBMPlexMono-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
      font-display: block;
    }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #050509;
    }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      color: #f4f5f7;
      font-family: "IBM Plex Sans", sans-serif;
    }
    .bg {
      position: absolute;
      inset: 0;
      background:
        url("og-atmosphere.jpg") center / cover no-repeat;
      filter: saturate(1.15) brightness(0.38) contrast(1.08);
    }
    .wash {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 58% at 50% 44%, rgba(5, 5, 9, 0.28) 0%, rgba(5, 5, 9, 0.72) 72%, #050509 100%),
        linear-gradient(180deg, rgba(5, 5, 9, 0.38) 0%, rgba(5, 5, 9, 0.22) 40%, rgba(5, 5, 9, 0.55) 100%);
    }
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(0, 212, 224, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 212, 224, 0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at 50% 45%, #000 20%, transparent 75%);
      opacity: 0.45;
    }
    .orb-cyan {
      position: absolute;
      width: 420px;
      height: 420px;
      left: 50%;
      top: 38%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle, rgba(0, 212, 224, 0.22) 0%, transparent 68%);
      pointer-events: none;
    }
    .orb-purple {
      position: absolute;
      width: 280px;
      height: 280px;
      right: 40px;
      top: 40px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.22) 0%, transparent 70%);
    }
    .orb-pink {
      position: absolute;
      width: 240px;
      height: 240px;
      left: 20px;
      bottom: 20px;
      background: radial-gradient(circle, rgba(255, 43, 214, 0.16) 0%, transparent 70%);
    }
    .frame {
      position: absolute;
      inset: 28px;
      border: 1px solid rgba(0, 212, 224, 0.22);
      border-radius: 18px;
      box-shadow: inset 0 0 80px rgba(0, 212, 224, 0.04);
    }
    .frame::before, .frame::after {
      content: "";
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid #00D4E0;
    }
    .frame::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
    .frame::after { top: -1px; right: -1px; border-left: 0; border-bottom: 0; }
    .frame-br, .frame-bl {
      position: absolute;
      width: 18px;
      height: 18px;
      border: 2px solid #00D4E0;
    }
    .frame-bl { bottom: -1px; left: -1px; border-right: 0; border-top: 0; }
    .frame-br { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
    .lockup {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 2;
      padding: 0 96px;
    }
    .kicker {
      font-family: "IBM Plex Mono", monospace;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: #00D4E0;
    }
    .kicker span {
      color: #8B5CF6;
      letter-spacing: 0.28em;
    }
    .pulse-line {
      width: 220px;
      height: 28px;
      margin: 14px 0 6px;
    }
    .title {
      font-family: Syne, sans-serif;
      font-weight: 800;
      font-size: 132px;
      line-height: 0.92;
      letter-spacing: 0.14em;
      color: #00D4E0;
      text-shadow:
        0 0 18px rgba(0, 212, 224, 0.55),
        0 0 48px rgba(0, 212, 224, 0.28),
        0 0 90px rgba(139, 92, 246, 0.22);
      margin: 0;
      padding-left: 0.14em;
    }
    .subtitle {
      margin-top: 14px;
      font-size: 26px;
      font-weight: 500;
      letter-spacing: 0.04em;
      color: #e8eaef;
    }
    .funnel {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 34px;
    }
    .chip {
      font-family: "IBM Plex Mono", monospace;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 10px 22px;
      border-radius: 8px;
      background: rgba(11, 11, 18, 0.78);
      border: 1px solid rgba(0, 212, 224, 0.35);
    }
    .chip.views { color: #00D4E0; border-color: rgba(0, 212, 224, 0.7); box-shadow: 0 0 18px rgba(0, 212, 224, 0.18); }
    .chip.profile { color: #c4b5fd; border-color: rgba(139, 92, 246, 0.75); box-shadow: 0 0 18px rgba(139, 92, 246, 0.2); }
    .chip.link { color: #FF2BD6; border-color: rgba(255, 43, 214, 0.7); box-shadow: 0 0 18px rgba(255, 43, 214, 0.18); }
    .arrow {
      color: #00FF9C;
      font-size: 22px;
      font-weight: 600;
      text-shadow: 0 0 12px rgba(0, 255, 156, 0.4);
    }
    .status {
      position: absolute;
      top: 48px;
      right: 52px;
      display: flex;
      gap: 8px;
      z-index: 3;
    }
    .pip {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .pip.g { background: #00FF9C; box-shadow: 0 0 8px #00FF9C; }
    .pip.r { background: #FF3B5C; box-shadow: 0 0 8px #FF3B5C; }
    .pip.c { background: #00D4E0; box-shadow: 0 0 8px #00D4E0; }
  </style>
</head>
<body>
  <div class="card">
    <div class="bg"></div>
    <div class="wash"></div>
    <div class="grid"></div>
    <div class="orb-cyan"></div>
    <div class="orb-purple"></div>
    <div class="orb-pink"></div>
    <div class="frame">
      <span class="frame-bl"></span>
      <span class="frame-br"></span>
    </div>
    <div class="status" aria-hidden="true">
      <span class="pip g"></span>
      <span class="pip c"></span>
      <span class="pip r"></span>
    </div>
    <div class="lockup">
      <div class="kicker">Командный центр <span>· COMMAND CENTER</span></div>
      <svg class="pulse-line" viewBox="0 0 220 28" fill="none" aria-hidden="true">
        <path d="M4 18 H48 L62 6 L78 24 L94 4 L110 18 H216" stroke="#00D4E0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="216" cy="18" r="3.2" fill="#00D4E0"/>
      </svg>
      <h1 class="title">PULSE</h1>
      <p class="subtitle">AI Instagram Growth Command Center</p>
      <div class="funnel">
        <span class="chip views">Views</span>
        <span class="arrow">→</span>
        <span class="chip profile">Profile</span>
        <span class="arrow">→</span>
        <span class="chip link">Link</span>
      </div>
    </div>
  </div>
</body>
</html>
